# Hạ tầng dịch vụ chạy ngầm cho Ban Chỉnh Đạo Digital Library
services:
  # 1. Cơ sở dữ liệu chính: PostgreSQL 16 kết hợp tiện ích không gian PostGIS
  db:
    image: postgis/postgis:16-3.4
    container_name: caodai_bcd_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_dev}
      POSTGRES_DB: ${POSTGRES_DB:-caodai_digital_library}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-caodai_digital_library}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - caodai_network

  # 2. Redis: Bộ nhớ đệm (Cache) và Hàng đợi công việc nền (BullMQ Queue)
  redis:
    image: redis:7-alpine
    container_name: caodai_bcd_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - caodai_network

  # 3. MinIO: Kho lưu trữ đối tượng S3-compatible (Lưu bản scan gốc PDF & hình ảnh)
  minio:
    image: minio/minio:latest
    container_name: caodai_bcd_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_password_dev}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 3
    networks:
      - caodai_network

volumes:
  postgres_data:
    name: caodai_bcd_postgres_data
  redis_data:
    name: caodai_bcd_redis_data
  minio_data:
    name: caodai_bcd_minio_data

networks:
  caodai_network:
    name: caodai_bcd_network
    driver: bridge
